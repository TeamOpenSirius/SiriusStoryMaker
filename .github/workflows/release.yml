name: Build & Release

on:
  push:
    tags:
      - '0.*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win msi --x64 --publish never
            artifact_pattern: release/*.msi
          - os: ubuntu-latest
            builder_args: --linux AppImage --x64 --publish never
            artifact_pattern: release/*.AppImage
          - os: macos-latest
            builder_args: --mac dmg --arm64 --x64 --publish never
            artifact_pattern: release/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix player

      - name: Run unit tests & typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Package installer (${{ matrix.os }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.json ${{ matrix.builder_args }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -lh release-artifacts

      - name: Determine release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qiE '(beta|alpha|rc|^0\.)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=SiriusStoryMaker ${TAG} (Beta)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=SiriusStoryMaker ${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-artifacts/*
